<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอปร้านค้า</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Anuphan:wght@400;500;600;700&display=swap">
<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ธีมเดียวกับแอปตาม Slide CBC: สว่างแบบห้องปฏิบัติการ พื้นขาว-ฟ้าอ่อน ตัวอักษรน้ำเงินเข้ม
   สีหลักเขียวน้ำทะเล ปุ่มเมนูไล่เฉด เขียว/ฟ้า/ม่วง/ส้ม ตัวหนังสือขยายได้ 3 ระดับ (ผู้ใช้สูงอายุอ่านง่าย) */
:root{
  color-scheme:light;
  --bg:#eef3f7; --surface:#ffffff; --sunk:#f7fafc; --ink:#102a43; --muted:#52677d; --line:#d6e1ea;
  --teal:#0b7a75; --teal-soft:#e1f3f1; --blue:#1f5fae; --blue-soft:#e7eff9; --violet:#5a45a8; --violet-soft:#efecfa;
  --acc:var(--teal); --on-acc:#ffffff;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#a85300; --warn-bg:#fff3df; --bad:#b42318; --bad-bg:#fdeceb; --info:#1f5fae; --info-bg:#e7eff9; --mute-bg:#eceff2;
  --m1:#009688; --m2:#1f5fae; --m3:#5a45a8; --m4:#c07a12;
  --shadow:0 1px 2px rgba(16,42,67,.06),0 4px 14px rgba(16,42,67,.06);
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html{font-size:calc(16px * var(--fs,1.12))}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.3rem}h3{font-size:1.05rem}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.86rem}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:40px;height:40px;border-radius:11px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-family:var(--f-head);font-size:1.12rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{display:block;font-size:.8rem;color:var(--muted)}
.brand>div{min-width:0}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:.9rem}
.demo{background:var(--sunk);border-bottom:1px solid var(--line)}
.demo-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.86rem;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-tag{font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

main{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:560px;margin:0 auto;width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h2{font-size:1.5rem}
.date{font-size:.9rem;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--acc)}
.tile:active{transform:scale(.98)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.count{text-align:right;line-height:1.1}
.count b{display:block;font-family:var(--f-head);font-size:1.7rem;font-variant-numeric:tabular-nums}
.count span{font-size:.75rem;color:var(--muted)}
.tile h3{font-size:1.08rem}
.tile p{margin:0;font-size:.85rem;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;align-self:flex-start}
.flag.bad{background:var(--bad-bg);color:var(--bad)}.flag.ok{background:var(--ok-bg);color:var(--ok)}

.panel.news{flex-direction:row;gap:14px;align-items:flex-start}
.news .ic{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.news-t{min-width:0;flex:1}
.news-t b{font-family:var(--f-head);font-size:1.05rem;display:block}
.news-t p{margin:2px 0 0;font-size:.9rem;color:var(--muted);white-space:pre-line}

.page-head{display:flex;flex-direction:column;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px 7px 10px;font-weight:600;cursor:pointer}
.back svg{width:20px;height:20px}
.title-row{display:flex;align-items:center;gap:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-acc{background:var(--acc);color:var(--on-acc)}
.btn-acc:hover{filter:brightness(1.07)}
.btn-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--acc)}
.btn-ok{background:var(--ok);color:var(--surface)}.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn-block{width:100%;padding:14px}
.btn:disabled{opacity:.6;cursor:wait}
.big-act{min-height:76px;font-size:1.02rem;border-radius:14px}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.94rem}
.opt{font-weight:400;color:var(--muted);font-size:.84rem}
.input{width:100%;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);font-size:1rem}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.scanrow{display:flex;gap:8px}.scanrow .input{flex:1}
.cam{flex:none;width:52px;border:0;border-radius:10px;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center}
.cam svg{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .input{max-width:260px}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 2px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item.click{cursor:pointer;border-radius:10px;padding-inline:8px;margin-inline:-6px}
.item.click:hover{background:var(--sunk)}
.item-main{min-width:0}
.item-main b{font-weight:600}
.item-sub{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.item-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tagno{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-open{background:var(--warn-bg);color:var(--warn)}.t-doing{background:var(--info-bg);color:var(--info)}
.t-done{background:var(--ok-bg);color:var(--ok)}.t-issue{background:var(--bad-bg);color:var(--bad)}.t-rejected{background:var(--mute-bg);color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:.92rem}
.alert{padding:11px 14px;border-radius:10px;font-size:.92rem;white-space:pre-line}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}

.ticket-no{border:2.5px dashed var(--acc);border-radius:14px;padding:16px;text-align:center}
.ticket-no b{display:block;font-family:var(--f-mono);font-size:2rem;letter-spacing:.06em;color:var(--acc)}
.done{align-items:center;text-align:center}
.tick{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.94rem;text-align:left}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

.chk{display:flex;flex-direction:column;gap:8px}
.chk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.chk-ph{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chk-cam{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--acc);color:var(--acc);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.86rem;cursor:pointer}
.chk-cam svg{width:18px;height:18px}.chk-cam.need{border-style:solid;background:color-mix(in srgb,var(--acc) 8%,var(--surface))}
.chk-ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.chk-ph .tm{font-size:.78rem;color:var(--muted)}
.chk-pv{display:flex;gap:8px;align-items:center}
.chk-row.ok{border-color:var(--ok);background:var(--ok-bg)}.chk-row.no{border-color:var(--bad);background:var(--bad-bg)}
.yn{display:flex;gap:6px}
.yn button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.yn button.y[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.yn button.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.listcard{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.listcard:hover{border-color:var(--acc)}
.listcard b{font-family:var(--f-head);font-size:1.02rem}

.photo-take{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:14px;background:var(--sunk);color:var(--acc);font-weight:600;cursor:pointer}
.photo-take svg{width:22px;height:22px}
.photo-prev{display:flex;gap:12px;align-items:center}
.photo-prev img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi-h{display:flex;align-items:center;gap:8px;font-weight:600;font-family:var(--f-head)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.kpi-n{display:flex;gap:16px;flex-wrap:wrap}
.kpi-n div{display:flex;flex-direction:column;line-height:1.2}
.kpi-n b{font-family:var(--f-head);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi-n span{font-size:.75rem;color:var(--muted)}
.kpi-n .bad b{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.plot svg{display:block;width:100%}
.plot text{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.plot .val{fill:var(--ink);font-weight:600}
.urow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.urow:first-child{border-top:0}

/* บิลค่าเช่า */
.bill{width:100%;border-collapse:collapse;font-size:.94rem}
.bill td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.bill td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.bill .calc{display:block;font-size:.8rem;color:var(--muted)}
.bill tr.sum td{border-top:2px solid var(--ink);font-weight:700;font-size:1.05rem}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mh b{font-family:var(--f-head)}
.mtot{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.mtot.bad{color:var(--bad);font-family:var(--f-body);font-size:.84rem}
.mrow .field label{font-size:.82rem;font-weight:500;color:var(--muted)}
.mrow.billed{grid-template-columns:1fr;color:var(--muted)}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--acc)}
/* ประกาศใหญ่หน้าแรก */
.newsbig{padding:0;overflow:hidden;gap:0;cursor:pointer;text-align:left;border:1px solid #dde7ef;width:100%;font:inherit;color:inherit}
.newsbig img,.newsimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--sunk)}
.newsbig .nb{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.newsbig .tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:.8rem;border-radius:999px;padding:2px 10px}
.newsbig .tag svg{width:16px;height:16px}
.newsbig h2{font-size:1.35rem}
.newsbig p{margin:0;color:var(--muted);white-space:pre-line}
.newsimg{border-radius:12px;margin-top:8px}
/* เลือกบทบาทในหน้าเข้าสู่ระบบ */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;color:var(--ink);transition:transform .1s,border-color .2s,background .2s}
.role svg{width:28px;height:28px;color:var(--muted)}
.role[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.role[aria-pressed="true"] svg{color:var(--teal)}
.role:active{transform:scale(.97)}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-size:.92rem;text-decoration:underline;align-self:center}
.codebox{font-family:var(--f-mono);font-size:2.2rem;letter-spacing:.2em;text-align:center;border:2.5px dashed var(--teal);border-radius:14px;padding:12px;color:var(--teal)}
.urow{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}
.urow>.chips{flex-wrap:wrap;gap:6px}
/* ผังห้อง */
.rbld{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rfloor{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.rfl{font-size:.8rem;color:var(--muted);padding-top:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.rc{position:relative;height:40px;border-radius:9px;border:2px solid transparent;font-family:var(--f-mono);font-weight:600;font-size:.88rem;cursor:pointer;transition:transform .1s}
.rc:active{transform:scale(.95)}
.rc-vac{background:var(--mute-bg);color:var(--muted);border-color:var(--line)}
.rc-ok{background:var(--ok-bg);color:var(--ok)}
.rc-due{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.rc-late{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.rc-slip{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.rc-rep{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--m4);border:2px solid #fff}
.rc-dot{display:inline-block;width:12px;height:12px;border-radius:4px}
.rc-dot.rc-vac{border:1px solid var(--line)}
/* แชต */
.thread{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px;background:var(--sunk);border-radius:12px;padding:10px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-line;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--teal);color:#fff;border-color:var(--teal);border-radius:14px 14px 4px 14px}
.bub small{display:block;font-size:.72rem;opacity:.75;margin-top:2px}
.sendrow{display:flex;gap:8px}.sendrow .input{flex:1}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700}
/* รถ */
.carcard{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff}
.carcard.ok{border-color:var(--ok)}.carcard.warn{border-color:var(--warn)}

/* ---------- ธีม CBC: ส่วนที่ปรับทับ ---------- */
body{background:linear-gradient(180deg,#e8f1f6 0,var(--bg) 260px) no-repeat,var(--bg)}
.top{border-top:4px solid var(--teal);box-shadow:0 6px 18px rgba(16,42,67,.05)}

.tile{border:0;color:#fff;overflow:hidden;min-height:150px;transition:transform .12s ease,box-shadow .2s ease}
.tile::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.tile::before{content:"";position:absolute;right:18px;bottom:-46px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.tile.t0{background:linear-gradient(150deg,#0f8f88 0%,#0a6b67 100%)}
.tile.t1{background:linear-gradient(150deg,#2b70c4 0%,#1a5196 100%)}
.tile.t2{background:linear-gradient(150deg,#6954bd 0%,#4c3a93 100%)}
.tile.t3{background:linear-gradient(150deg,#d08a1f 0%,#a5650c 100%)}
.tile.tadm{background:linear-gradient(150deg,#28465f 0%,#102a43 100%)}

.tile .ic{background:rgba(255,255,255,.17);color:#fff}

.tile p{color:rgba(255,255,255,.9)}
.count span{color:rgba(255,255,255,.85)}
.flag.bad{background:#fff;color:var(--bad)}
.ic{background:var(--teal-soft);color:var(--teal)}
/* ปุ่มกลับหน้าแรก ใหญ่ ขอบเข้ม */
.back{border:2px solid var(--ink);padding:9px 18px 9px 12px;font-size:1rem;box-shadow:var(--shadow)}
.back svg{width:22px;height:22px}
.btn-acc{box-shadow:0 2px 6px rgba(16,42,67,.14)}
.btn-line:hover{border-color:#b9cad8}
.big-act.btn-acc{background:linear-gradient(150deg,#0f8f88 0%,#0a6b67 100%)}
.big-act.btn-line{background:linear-gradient(150deg,#2b70c4 0%,#1a5196 100%);color:#fff;border:0}
.btn:active,.back:active,.chip:active,.tile:active,.listcard:active,.fs button:active{transform:scale(.97)}
.btn:disabled::before{content:"";width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;flex:none}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,95,174,.13)}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.modal{background:rgba(10,24,40,.55)}
.modal-box{border-radius:18px;box-shadow:0 20px 50px rgba(10,24,40,.35)}
.modal-x{background:rgba(16,42,67,.08)}
.toast{box-shadow:0 10px 30px rgba(10,24,40,.3);font-weight:500}
.sk{background:linear-gradient(90deg,#edf2f6 25%,#f7fafc 40%,#edf2f6 60%);background-size:300% 100%;border-radius:12px}
.meter i{background:var(--teal)}
.ticket-no{border-color:var(--teal)}.ticket-no b{color:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .btn:disabled::before{animation:spin .7s linear infinite}
  .sk{animation:sh 1.3s ease infinite}
  .tick{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

function demoProps(sh){if(DPLAN==='pro'){sh.props.PLAN='pro';sh.props.LICENSE='ST-DEMO-DEMO-DEMO';sh.props.LICENSEE='ร้านตัวอย่าง';sh.props.LICCHECK=String(Date.now())}else{delete sh.props.PLAN;delete sh.props.LICENSE;delete sh.props.LICENSEE}}
async function demoReady(){if(BACK)return;
  const src=new TextDecoder().decode(Uint8Array.from(atob(DSRC.split('').reverse().join('')),c=>c.charCodeAt(0)));
  const sh=GASShim({});demoProps(sh);sh.props.BIZTYPE=DTYPE;const G=loadGAS(src,sh,['seedDemo_','bizList_']);
  const ts=G.bizList_();if(!ts.some(t=>t.id===DTYPE)){DTYPE='mart';sh.props.BIZTYPE='mart'}$('#demo-type').innerHTML=ts.map(t=>`<option value="${t.id}" ${t.id===DTYPE?'selected':''}>${esc(t.label)}</option>`).join('');G.seedDemo_();BACK={A:G.API_FUNCS,sh};
  if(DAS!=='login')demoLogin(DAS)}
function demoLogin(r){const u=DUSER[r];if(!u)return;const t=BACK.A.apiLogin(u[0],'test2569',u[1]).token;saveTok(t,false)}
async function demoRun(fn,args){await new Promise(r=>setTimeout(r,120));const f=BACK.A[fn];if(!f)throw new Error('ฟีเจอร์นี้อยู่ในแพ็กเกจโปร');
  try{return JSON.parse(JSON.stringify(f(...JSON.parse(JSON.stringify(args)))))}
  catch(e){const m=String(e&&e.message||e).replace(/^Exception:\s*/,'');if(/เข้าสู่ระบบใหม่|กรุณาเข้าสู่ระบบ/.test(m)){clearTok();ME=null}throw new Error(m)}}
function demoMark(r){DAS=r;store.set('stDemoAs',r)}
function paintDemo(){const d=$('#demo');d.hidden=false;
  d.querySelectorAll('[data-r]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===DAS));d.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===DPLAN))}
document.querySelectorAll('#demo-role [data-r]').forEach(b=>b.onclick=async()=>{const r=b.dataset.r;await demoReady();
  demoMark(r);clearTok();ME=null;if(r!=='login')demoLogin(r);view={name:'home'};boot()});
document.querySelectorAll('#demo-plan [data-p]').forEach(b=>b.onclick=async()=>{DPLAN=b.dataset.p;store.set('stDemoPlan',DPLAN);await demoReady();demoProps(BACK.sh);boot()});

  const hello=ME?`สวัสดีครับ คุณ${esc(ME.nick||ME.first||'')} มีอะไรให้${BOT_NAME}ช่วยไหมครับ`:`สวัสดีครับ ${BOT_NAME}ช่วยแนะนำการใช้งานได้ครับ`;

  const say=t=>{const s=m.el.querySelector('#hp-say');s.innerHTML=t;s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')},b=()=>m.el.querySelector('#hp-b');
  const tab=k=>{m.el.querySelectorAll('[data-ht]').forEach(x=>x.setAttribute('aria-selected',x.dataset.ht===k));

let PRODS=null,BARS={},PRODS_AT=0;
function indexProds(){BARS={};(PRODS||[]).forEach(p=>{if(p.bar)BARS[p.bar.toUpperCase()]={p,u:0};BARS[p.id.toUpperCase()]=BARS[p.id.toUpperCase()]||{p,u:0};(p.units||[]).forEach((u,i)=>{if(u.bar)BARS[u.bar.toUpperCase()]={p,u:i+1}})})}
async function loadProds(force){if(PRODS&&!force&&Date.now()-PRODS_AT<5*6e4)return PRODS;PRODS=await run('apiProducts',tok());PRODS_AT=Date.now();indexProds();return PRODS}
function patchProds(list){(list||[]).forEach(n=>{const i=PRODS.findIndex(p=>p.id===n.id);if(i>=0)PRODS[i]=n;else PRODS.push(n)});indexProds()}
const prod=id=>(PRODS||[]).find(p=>p.id===id);
const uInfo=(p,u)=>{const k=u>0&&(p.units||[])[u-1];return k?{name:k.n,mult:k.m,price:k.price}:{name:p.unit,mult:1,price:p.price}};
const findQ=q=>{q=String(q||'').trim().toLowerCase();if(!q)return [];const w=q.split(/\s+/);
  return (PRODS||[]).filter(p=>p.on&&w.every(x=>p.name.toLowerCase().includes(x)||(p.bar||'').toLowerCase().startsWith(x)||(p.cat||'').toLowerCase().includes(x)))};
const lowCls=p=>p.qty<=0?'low':p.qty<=p.min?'low':'';

/* ---------- กล้องสแกนบาร์โค้ด (html5-qrcode) ---------- */
let qr=null,scanCb=null;
async function openScanner(cb){scanCb=cb;$('#scan-ov').hidden=false;$('#scan-msg').textContent='กำลังเปิดกล้อง…';
  if(!window.Html5Qrcode){$('#scan-msg').textContent='โหลดตัวอ่านบาร์โค้ดไม่สำเร็จ พิมพ์เลขเองได้';return}
  try{qr=new Html5Qrcode('reader',{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    await qr.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(w*.9),height:Math.max(80,Math.floor(h*.4))})},gotCode,()=>{});
    $('#scan-msg').textContent='วางบาร์โค้ดแนวนอนให้เต็มกรอบ ห่างประมาณ 10–15 ซม.'}
  catch(e){$('#scan-msg').textContent='เปิดกล้องไม่ได้ กด "ถ่ายรูปบาร์โค้ดแทน" หรือปิดแล้วพิมพ์เลขเอง'}}
function gotCode(t){const cb=scanCb;closeScanner();if(navigator.vibrate)navigator.vibrate(60);if(cb)cb(String(t).trim())}
async function closeScanner(){$('#scan-ov').hidden=true;scanCb=null;if(qr){try{if(qr.isScanning)await qr.stop();qr.clear()}catch(e){}qr=null}}
$('#scan-close').onclick=closeScanner;
$('#scan-photo').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const cb=scanCb;
  try{if(qr&&qr.isScanning)await qr.stop();const r=qr||new Html5Qrcode('reader');const t=await r.scanFile(f,false);scanCb=cb;gotCode(t)}
  catch(err){$('#scan-msg').textContent='อ่านจากรูปไม่ได้ ถ่ายให้ใกล้และชัดขึ้น หรือพิมพ์เลขเอง'}});
const camBtn=id=>`<button type="button" class="cam" data-cam="${id}" aria-label="สแกนด้วยกล้อง">${icon('scan')}</button>`;
function bindCams(el,cb){el.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>openScanner(code=>cb?cb(code,b.dataset.cam):(()=>{const i=document.getElementById(b.dataset.cam);i.value=code;i.dispatchEvent(new Event('input',{bubbles:true}))})()))}
const fine=()=>window.matchMedia&&matchMedia('(pointer:fine)').matches;

/* ---------- ตะกร้า (เก็บในเครื่อง ปิดแอปแล้วยังอยู่) ---------- */
const newNonce=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
let CART=(()=>{try{const c=JSON.parse(store.get('stCart')||'');if(c&&Array.isArray(c.items))return c}catch(e){}return {items:[],disc:0,nonce:newNonce()}})();
const saveCart=()=>store.set('stCart',JSON.stringify(CART));
function cartAdd(p,u,q){u=u||0;q=q||1;if(!p.on)return toast('สินค้านี้เลิกขายแล้ว');
  const l=CART.items.find(x=>x.id===p.id&&x.u===u);if(l)l.qty=Math.round((l.qty+q)*1000)/1000;else CART.items.unshift({id:p.id,u,qty:q});
  CART.nonce=newNonce();saveCart();if(navigator.vibrate)navigator.vibrate(30)}
const wholeOK=(p,l)=>on('whole')&&l.u===0&&p.whole>0&&(CART.whole||(p.wq>0&&l.qty>=p.wq));
function cartCalc(){let sub=0;const need={};const lines=CART.items.map(l=>{const p=prod(l.id);if(!p)return null;let u=uInfo(p,l.u);if(wholeOK(p,l))u=Object.assign({},u,{price:p.whole,wh:1});sub+=l.qty*u.price;need[p.id]=(need[p.id]||0)+l.qty*u.mult;return {l,p,u,amt:l.qty*u.price}}).filter(Boolean);
  sub=Math.round(sub*100)/100;const disc=Math.min(sub,num(CART.disc));return {lines,sub,disc,total:Math.round((sub-disc)*100)/100,need,n:lines.reduce((s,x)=>s+x.l.qty,0)}}
const short=(c,p)=>!(BIZ.shop||{}).allowNeg&&c.need[p.id]>p.qty+1e-9;

      +(on('whole')&&PRODS.some(p=>p.on&&p.whole>0)?`<div class="cl"><div class="nm">ขายราคาส่งทั้งบิล<div class="sub">ใช้ราคาส่งกับทุกสินค้าที่ตั้งราคาส่งไว้</div></div><div><button type="button" class="chip" id="c-wh" aria-pressed="${!!CART.whole}">${CART.whole?'เปิดอยู่':'ปิด'}</button></div></div>`:'')

      :'<div class="empty">ยังไม่มีสินค้าในตะกร้า<br><span class="small">สแกนบาร์โค้ด หรือแตะสินค้าด้านล่าง</span></div>';
    $('#pb-t').textContent=baht(c.total);$('#pb-n').textContent=c.lines.length?`${qtyS(c.n)} ชิ้น${c.disc?' · ลด '+baht(c.disc):''}`:'ยังไม่มีสินค้า';$('#pb-go').disabled=!c.lines.length;
    const find=k=>{const [id,u]=k.split(':');return CART.items.find(l=>l.id===id&&l.u===+u)};

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function drawBars(el,d){const W=Math.max(280,el.clientWidth),H=200,L=44,R=6,T=12,B=24,pw=W-L-R,ph=H-T-B;
  const max=niceMax(Math.max(1,...d.map(x=>Math.max(x.a,x.b||0)))),step=pw/Math.max(1,d.length),bw=Math.max(2,Math.min(16,step*.36)),every=d.length<=12?1:d.length<=31?5:15;let g='';
  [0,.5,1].forEach(f=>{const y=T+ph-ph*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+4}" text-anchor="end">${baht(Math.round(max*f))}</text>`});
  d.forEach((x,i)=>{const cx=L+i*step+step/2;[[x.a,'var(--m1)',-1],[x.b,'var(--m3)',1]].forEach(([v,c,k])=>{if(!v||v<0)return;const h=ph*v/max;g+=`<rect x="${cx+(k<0?-bw-1:1)}" y="${T+ph-h}" width="${bw}" height="${Math.max(1,h)}" rx="2" fill="${c}"><title>${baht(Math.round(v))}</title></rect>`});
    if(i%every===0||i===d.length-1)g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${esc(x.l)}</text>`});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขาย">${g}</svg>`}

/* ---------- ป้ายราคา + บาร์โค้ด Code 128 (โปร) ---------- */
const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128(s){s=String(s).replace(/[^\x20-\x7e]/g,'');const c=[];
  if(/^\d+$/.test(s)&&s.length>=4){let i=0;if(s.length%2){c.push(104,s.charCodeAt(0)-32,99);i=1}else c.push(105);for(;i<s.length;i+=2)c.push(+s.substr(i,2))}
  else{c.push(104);for(const ch of s)c.push(ch.charCodeAt(0)-32)}
  let sum=c[0];for(let i=1;i<c.length;i++)sum+=c[i]*i;c.push(sum%103,106);return c.map(v=>C128[v]).join('')}
function barSvg(s){const w=code128(s);let x=10,r='';for(let i=0;i<w.length;i++){const n=+w[i];if(i%2===0)r+=`<rect x="${x}" y="0" width="${n}" height="40"/>`;x+=n}
  return `<svg viewBox="0 0 ${x+10} 40" preserveAspectRatio="none" aria-hidden="true">${r}</svg>`}

    const btn=(u,a,l,c)=>`<button class="btn ${c} btn-sm" data-u="${esc(u.id)}" ${a}>${l}</button>`;
    const row=u=>`<div class="urow"><div class="item-main"><b>${esc(u.first)} ${esc(u.last)}</b><div class="item-sub">${sub(u)}</div>${u.resetAt?`<div class="item-sub" style="color:var(--warn)">ขอรีเซ็ตรหัสเมื่อ ${esc(u.resetAt)} · โทรยืนยันก่อนออกรหัส</div>`:''}</div>
      <div class="chips">${u.id===ME.id?'<span class="small muted">บัญชีของคุณ</span>':u.state==='รออนุมัติ'?btn(u,'data-s="active"','อนุมัติ','btn-ok')+btn(u,'data-s="off"','ปฏิเสธ','btn-bad')
        :u.state==='ระงับ'?'<span class="pill t-rejected">ระงับ</span>'+btn(u,'data-s="active"','เปิดใช้','btn-line')
        :(u.role==='staff'?`<select class="input" style="width:auto;padding:6px 10px" data-pos="${esc(u.id)}" aria-label="ตำแหน่ง">${Object.entries(BIZ.pos).map(([k,v])=>`<option value="${k}" ${u.pos===k?'selected':''}>${esc(v)}</option>`).join('')}</select>`:'')
         +btn(u,`data-r="${u.role==='admin'?'staff':'admin'}"`,u.role==='admin'?'ลดเป็นพนักงาน':'ตั้งเป็นเจ้าของร้าน','btn-line')+btn(u,'data-x="1"','ออกรหัสชั่วคราว','btn-line')+btn(u,'data-s="off"','ระงับ','btn-bad')}</div></div>`;
    const sec=(t,a)=>a.length?`<section class="panel"><h3>${t} (${a.length})</h3><div>${a.map(row).join('')}</div></section>`:'';
    $('#pane').innerHTML=(PRO()?'':`<div class="alert info small">แพ็กเกจฟรีใช้งานได้ ${BIZ.freeStaff} คน (รวมเจ้าของร้าน)</div>`)+sec('ขอรีเซ็ตรหัสผ่าน',reqs)+sec('รออนุมัติ',pend)+sec('ผู้ใช้ทั้งหมด',rest);
    app.querySelectorAll('select[data-pos]').forEach(sel=>sel.onchange=async()=>{try{await run('apiSetUser',tok(),sel.dataset.pos,{pos:sel.value});toast('เปลี่ยนตำแหน่งแล้ว');paneUsers()}catch(e){toast(e.message)}});
    app.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{busy(b,true,'…');
      try{if(b.dataset.x){const r=await run('apiResetUser',tok(),b.dataset.u);modal(`<h2>รหัสชั่วคราวของ ${esc(r.id)}</h2><div class="codebox">${esc(r.code)}</div><div class="alert info">บอกรหัสนี้กับเจ้าของบัญชีทางโทรศัพท์หรือ LINE เท่านั้น เข้าระบบแล้วจะต้องตั้งรหัสใหม่ทันที</div>`);busy(b,false);return}
        await run('apiSetUser',tok(),b.dataset.u,b.dataset.s?{state:b.dataset.s}:{role:b.dataset.r});toast('บันทึกแล้ว');paneUsers()}catch(e){toast(e.message);busy(b,false)}});
  }).catch(e=>{$('#pane').innerHTML=errBox(e.message)});
}
function paneSettings(){
  run('apiSettings',tok()).then(st=>{if(!$('#pane'))return;const s=st.shop,pay=st.pay||{},rc=st.receipt||{};
    $('#pane').innerHTML=`<section class="panel"><h3>ประเภทร้าน</h3><div class="small muted">ใช้ตั้งหมวดสินค้า หน่วยนับ และคำแนะนำให้ตรงกับร้าน เปลี่ยนได้ทุกเมื่อ ข้อมูลเดิมไม่หาย</div>
        <div class="chips" style="margin-top:8px">${st.typeLock?`<span class="chip" aria-pressed="true">${icon('lock','pico')} ${esc(((st.types||[]).find(t=>t.id===st.typeLock)||{}).label||st.typeLock)}</span></div><div class="small muted" style="margin-top:6px">แพ็กเกจโปรล็อกประเภทธุรกิจตามที่ซื้อไว้ (1 รหัส = 1 กิจการ) ถ้าเลือกผิด ทัก LINE @352ismlf ให้เปลี่ยนให้`:(st.types||[]).map(t=>`<button type="button" class="chip" data-bt="${t.id}" aria-pressed="${t.id===st.type}">${esc(t.label)}</button>`).join('')}</div><div id="s-e0"></div></section>
      <section class="panel"><h3>ข้อมูลร้าน <span class="small muted">(แสดงบนใบเสร็จ)</span></h3>
        <div class="field"><label for="s-org">ชื่อร้าน</label><input class="input" id="s-org" maxlength="60" value="${esc(st.org)}"></div>
        <div class="row2"><div class="field"><label for="s-ph">เบอร์ร้าน</label><input class="input mono" id="s-ph" inputmode="tel" value="${esc(s.phone)}"></div><div class="field"><label for="s-ln">LINE ร้าน</label><input class="input" id="s-ln" value="${esc(s.line)}" placeholder="@..."></div></div>
        <div class="field"><label for="s-ad">ที่อยู่</label><input class="input" id="s-ad" maxlength="200" value="${esc(s.addr)}"></div>
        <div class="field"><label for="s-ft">ข้อความท้ายใบเสร็จ</label><input class="input" id="s-ft" maxlength="120" value="${esc(s.footer)}"></div>
        <label class="small" style="display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px"><input type="checkbox" id="s-neg" ${s.allowNeg?'checked':''} style="width:22px;height:22px;accent-color:var(--teal);flex:none">
          <span><b>ขายได้แม้สต็อกในระบบไม่พอ</b><br><span class="muted">เปิดถ้ายังไม่ได้นับสต็อกตั้งต้น หรือของมาถึงก่อนบันทึกรับเข้า · คงเหลือจะติดลบ แล้วค่อยปรับสต็อกภายหลัง</span></span></label>
        ${locked('credit')?'':`<div class="field"><label for="s-cd">วงเงินเริ่มต้น เมื่อพนักงานเพิ่มลูกค้าเงินเชื่อ (บาท) <span class="opt">0 = ไม่จำกัด</span></label><input class="input mono" id="s-cd" inputmode="numeric" value="${s.credDef!=null?s.credDef:500}"></div>`}
        <div id="s-e1"></div><button class="btn btn-acc" id="s-s1">บันทึกข้อมูลร้าน</button></section>
      <section class="panel"><h3>สิทธิ์ของแต่ละตำแหน่ง</h3>${Object.entries(st.pos).map(([k,v])=>`<div class="field"><span class="lab">${esc(v)}</span><div class="chips">${Object.entries(st.feat).map(([f,l])=>`<button type="button" class="chip" data-pp="${k}" data-f="${f}" aria-pressed="${(st.perms[k]||[]).includes(f)}">${esc(l)}</button>`).join('')}</div></div>`).join('')}
        <div class="small muted">เจ้าของร้านทำได้ทุกอย่าง · ยกเลิกบิลได้เฉพาะเจ้าของร้าน</div><div id="s-e2"></div><button class="btn btn-acc" id="s-s2">บันทึกสิทธิ์</button></section>
      <section class="panel"><h3>รับเงินด้วยพร้อมเพย์</h3><div class="small muted">แสดง QR ใส่ยอดอัตโนมัติตอนคิดเงิน${PRO()?'':' · <b>ใช้ได้ในแพ็กเกจโปร</b>'}</div>
        <div class="row2"><div class="field"><label for="pp-n">เบอร์ / เลข 13 หลักที่ผูกพร้อมเพย์</label><input class="input mono" id="pp-n" inputmode="numeric" value="${esc(pay.pp||'')}"></div><div class="field"><label for="pp-a">ชื่อบัญชี</label><input class="input" id="pp-a" value="${esc(pay.name||'')}"></div></div>
        <div class="field"><label for="pp-b">ธนาคาร</label><input class="input" id="pp-b" value="${esc(pay.bank||'')}"></div><div id="s-e3"></div><button class="btn btn-acc" id="s-s3">บันทึกพร้อมเพย์</button></section>
      <section class="panel"><h3>หัวใบเสร็จ</h3><div class="field"><label for="rc-n">ชื่อผู้รับเงิน / กิจการ</label><input class="input" id="rc-n" value="${esc(rc.name||'')}"></div>
        <div class="field"><label for="rc-t">เลขประจำตัวผู้เสียภาษี <span class="opt">(ถ้ามี)</span></label><input class="input mono" id="rc-t" inputmode="numeric" value="${esc(rc.tax||'')}"></div>
        <div class="small muted">ใบเสร็จนี้ไม่ใช่ใบกำกับภาษีเต็มรูป</div><div id="s-e4"></div><button class="btn btn-acc" id="s-s4">บันทึกหัวใบเสร็จ</button></section>
      <section class="panel"><h3>การเก็บข้อมูลส่วนบุคคล</h3><textarea class="input" id="pv-t" rows="6">${esc(st.privacy)}</textarea><div id="s-e5"></div><button class="btn btn-acc" id="s-s5" style="margin-top:8px">บันทึก</button></section>`;
    app.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));
    app.querySelectorAll('[data-bt]').forEach(b=>b.onclick=async()=>{try{await run('apiSaveSettings',tok(),{type:b.dataset.bt});await boot2();toast('เปลี่ยนเป็น '+BIZ.typeLabel+' แล้ว');paneSettings()}catch(e){$('#s-e0').innerHTML=errBox(e.message)}});
    const save=(id,eid,data,msg)=>{$(id).onclick=async()=>{const b=$(id);busy(b,true);try{await run('apiSaveSettings',tok(),data());toast(msg);await boot2()}catch(e){$(eid).innerHTML=errBox(e.message)}busy(b,false)}};
    save('#s-s1','#s-e1',()=>({org:$('#s-org').value,shop:{phone:$('#s-ph').value,line:$('#s-ln').value,addr:$('#s-ad').value,footer:$('#s-ft').value,allowNeg:$('#s-neg').checked,credDef:$('#s-cd')?$('#s-cd').value:undefined}}),'บันทึกข้อมูลร้านแล้ว');
    save('#s-s2','#s-e2',()=>{const o={};Object.keys(st.pos).forEach(k=>o[k]=[...app.querySelectorAll(`[data-pp="${k}"][aria-pressed=true]`)].map(b=>b.dataset.f));return {perms:o}},'บันทึกสิทธิ์แล้ว');
    save('#s-s3','#s-e3',()=>({pay:{pp:$('#pp-n').value,name:$('#pp-a').value,bank:$('#pp-b').value}}),'บันทึกพร้อมเพย์แล้ว');
    save('#s-s4','#s-e4',()=>({receipt:{name:$('#rc-n').value,addr:(st.shop||{}).addr||'',tax:$('#rc-t').value}}),'บันทึกหัวใบเสร็จแล้ว');
    save('#s-s5','#s-e5',()=>({privacy:$('#pv-t').value}),'บันทึกแล้ว');
  }).catch(e=>{$('#pane').innerHTML=errBox(e.message)});
}

/* ---------- เส้นทาง ---------- */
function render(){
  if(!BIZ)return;paintHead();closeScanner();
  if(!ME&&!['login','register','forgot'].includes(view.name))view={name:'login'};
  ({login:vLogin,register:vRegister,forgot:vForgot,must:vMust,home:vHome,pos:vPos,prods:vProds,recv:vRecv,moves:vMoves,bills:vBills,close:vClose,credit:vCredit,report:vReport,labels:vLabels,admin:vAdmin})[view.name]();
  bindBack();bindLogout();app.querySelectorAll('[data-privacy]').forEach(b=>b.onclick=showPrivacy);window.scrollTo(0,0);
}
function go(name,o){view=Object.assign({name},o||{});render()}

/* ---------- เข้าสู่ระบบ / สมัคร ---------- */
let pickRole=['staff','admin'].includes(store.get('stRole'))?store.get('stRole'):'staff',tempPw='';
const ROLES=[['staff','พนักงาน','user'],['admin','เจ้าของร้าน','key']];
const roleChips=()=>`<div class="field"><span class="lab">ฉันเป็น</span><div class="roles" role="group" aria-label="บทบาท">${ROLES.map(r=>`<button type="button" class="role" data-role="${r[0]}" aria-pressed="${r[0]===pickRole}">${icon(r[2])}${r[1]}</button>`).join('')}</div></div>`;
function bindRoles(cb){app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{pickRole=b.dataset.role;store.set('stRole',pickRole);app.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x===b));cb&&cb()})}
async function afterLogin(me){ME=me;if(ME.must){view={name:'must'};render();return}
  const v=view&&!['login','register','forgot','must'].includes(view.name)?view:null;
  if(v)render();else if(!ME.can.includes('sell')||ME.role==='admin')go('home');else go(CART.items.length?'pos':'home')}
function vLogin(){
  app.innerHTML=`<div class="narrow stack"><section class="panel"><h2>เข้าสู่ระบบ</h2>
    <form class="form" id="f" novalidate>${roleChips()}
      <div class="field"><label for="l-id">ชื่อผู้ใช้</label><input class="input" id="l-id" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="l-pw">รหัสผ่าน</label><input class="input" id="l-pw" type="password" autocomplete="current-password"></div>
      <label class="small" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="l-rem" checked style="width:20px;height:20px;accent-color:var(--teal);flex:none"><span>จำการเข้าสู่ระบบในเครื่องนี้ <span class="muted">(เอาออกถ้าเป็นเครื่องที่ใช้ร่วมกัน)</span></span></label>
      ${DEMO?'<div class="alert warn small">โหมดตัวอย่าง: ใช้แถบด้านบนสลับบทบาทได้เลย หรือเข้าด้วย owner.dang / mai.cashier / art.stock รหัส test2569</div>':''}
      <div id="err"></div><button class="btn btn-acc btn-block" type="submit">เข้าสู่ระบบ</button></form>
    <button class="linkbtn" id="to-forgot">ลืมรหัสผ่าน</button><button class="btn btn-line" id="to-reg">ยังไม่มีบัญชี สมัครใช้งาน</button>
    <button class="linkbtn" data-privacy>การเก็บข้อมูลส่วนบุคคล</button></section></div>`;
  bindRoles();$('#to-reg').onclick=()=>go('register');$('#to-forgot').onclick=()=>go('forgot');
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true,'กำลังตรวจสอบ…');
    try{tempPw=$('#l-pw').value;const r=await run('apiLogin',$('#l-id').value,tempPw,pickRole);saveTok(r.token,$('#l-rem').checked);view={name:'home'};await boot()}catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false)}};
}
function vRegister(){
  app.innerHTML=`<div class="narrow stack"><section class="panel"><h2>สมัครใช้งาน</h2><form class="form" id="f" novalidate>${roleChips()}
      <div class="alert info" id="r-note"></div>
      <div class="row2"><div class="field"><label for="r-first">ชื่อ</label><input class="input" id="r-first" autocomplete="given-name"></div><div class="field"><label for="r-last">นามสกุล</label><input class="input" id="r-last" autocomplete="family-name"></div></div>
      <div class="field"><label for="r-phone">เบอร์มือถือ</label><input class="input mono" id="r-phone" inputmode="tel" autocomplete="tel" placeholder="08x-xxx-xxxx"></div>
      <div class="field" id="r-posf"><span class="lab">ตำแหน่งงาน</span><div class="chips">${Object.entries(BIZ.pos||{}).map(([k,v])=>`<button type="button" class="chip" data-pos="${k}" aria-pressed="false">${esc(v)}</button>`).join('')}</div></div>
      <div class="field"><label for="r-id">ตั้งชื่อผู้ใช้</label><input class="input" id="r-id" autocomplete="username" autocapitalize="none" spellcheck="false"><span class="small muted">a–z ตัวเลข . _ - ยาว 3–20 ตัว เช่น mai.shop</span></div>
      <div class="field"><label for="r-pw">ตั้งรหัสผ่าน</label><input class="input" id="r-pw" type="password" autocomplete="new-password"><span class="small muted">6–20 ตัว ห้ามใช้ 123456 หรือ 111111</span></div>
      <div class="field"><label for="r-pw2">ยืนยันรหัสผ่าน</label><input class="input" id="r-pw2" type="password" autocomplete="new-password"></div>
      <label class="small" style="display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px"><input type="checkbox" id="r-ok" style="width:22px;height:22px;accent-color:var(--teal);flex:none">
        <span>ฉันอ่านและยินยอมตาม <button type="button" class="linkbtn" data-privacy style="padding:0">การเก็บข้อมูลส่วนบุคคล</button></span></label>
      <div id="err"></div><button class="btn btn-acc btn-block" type="submit">สมัคร</button></form><button class="btn btn-line" id="to-login">มีบัญชีแล้ว เข้าสู่ระบบ</button></section></div>`;
  let pos='';app.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{pos=b.dataset.pos;app.querySelectorAll('[data-pos]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const paint=()=>{$('#r-posf').hidden=pickRole!=='staff';$('#r-note').textContent=pickRole==='admin'?'คนแรกที่สมัครจะเป็นเจ้าของร้าน คนต่อไปต้องให้เจ้าของร้านอนุมัติ':'สมัครแล้วรอเจ้าของร้านอนุมัติ จึงเข้าใช้งานได้'};paint();bindRoles(paint);
  $('#to-login').onclick=()=>go('login');
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]'),v=k=>$('#r-'+k).value.trim();
    if($('#r-pw').value!==$('#r-pw2').value){$('#err').innerHTML=errBox('รหัสผ่านสองช่องไม่ตรงกัน');return}
    if(!$('#r-ok').checked){$('#err').innerHTML=errBox('กรุณากดยินยอมการเก็บข้อมูลส่วนบุคคลก่อนสมัคร');return}
    busy(b,true);
    try{const r=await run('apiRegister',{consent:true,role:pickRole,first:v('first'),last:v('last'),phone:v('phone'),id:v('id'),pw:$('#r-pw').value,pos:pickRole==='staff'?pos:''});
      app.innerHTML=`<div class="narrow"><section class="panel done"><div class="tick">${icon('check')}</div><h2>${r.firstAdmin?'สร้างบัญชีเจ้าของร้านแล้ว':'สมัครเรียบร้อย รอเจ้าของร้านอนุมัติ'}</h2>
        <div class="ticket-no" style="width:100%"><span class="small muted">ชื่อผู้ใช้ของคุณ</span><b>${esc(r.id)}</b></div><button class="btn btn-acc btn-block" id="ok">ไปหน้าเข้าสู่ระบบ</button></section></div>`;$('#ok').onclick=()=>go('login')}
    catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false)}};
}
function paintHead(){
  document.documentElement.dataset.plan=PRO()?'pro':'free';
  $('#mark').innerHTML=icon('logo');$('#org').textContent=BIZ.org;$('#bizname').innerHTML=esc(BIZ.name)+(PRO()?'<span class="pro-b">PRO</span>':'');
  $('#who').hidden=!ME;if(ME){$('#av').textContent=(ME.nick||ME.first||'?').slice(0,1);$('#whoname').textContent=ME.nick||ME.first}
  const lf=$('#licfoot');lf.hidden=false;lf.innerHTML=(BIZ.licensee?`ใบอนุญาตใช้งาน: <b>${esc(BIZ.licensee)}</b> · `:'')+`พัฒนาโดย ${esc(BIZ.dev||DEV)}`+(BIZ.ver?` · v${esc(BIZ.ver)}`:'')+(BIZ.support?' · <button class="linkbtn" id="supbtn">ติดต่อผู้พัฒนา</button>':'');
  {const sb=$('#supbtn');if(sb)sb.onclick=showSupport}
  if(DEMO)paintDemo();
}

/* ---------- เริ่มแอป ---------- */
async function boot2(){try{const d=await run('apiInit',tok());BIZ=d.biz;if(d.me)ME=d.me}catch(e){}}
async function boot(){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  if(NEED_CONNECT)return vConnect();PRODS=null;
  try{if(DEMO)await demoReady();
    const d=await run('apiInit',tok());BIZ=d.biz;
    if(d.me){await afterLogin(d.me);return}
    ME=null;view={name:'login'};render()}
  catch(err){app.innerHTML=`<div class="narrow">${errBox('โหลดไม่สำเร็จ: '+err.message)}</div>`}
}
$('#brand').onclick=()=>{ME?go('home'):go('login')};
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>setFs(b.dataset.fs));setFs(store.get('stFs')||'1');
boot();

})();
</script>
</body>
